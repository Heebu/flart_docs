<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    const base = document.createElement('base');
    base.href = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
    document.head.appendChild(base);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Flart — The Lightweight Web Framework for Dart with Virtual DOM & Pure Dart Performance">
  <meta name="theme-color" content="#0B0F19">
  <title>Flart — Pure Dart Web Framework</title>
  <link rel="icon" type="image/png" href="assets/dart_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      width: 100%;
      min-height: 100%;
      background-color: #0B0F19;
    }
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0B0F19;
      color: #E2E8F0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #app {
      width: 100%;
      min-height: 100%;
      display: block;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Pinned Sticky Navbar & Glassmorphic Backdrop */
    #flart-docs-navbar {
      position: sticky !important;
      top: 0 !important;
      z-index: 100 !important;
      background: rgba(11, 15, 25, 0.82) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    /* Pinned Sticky Sidebar (Independent scroll if content exceeds screen height) */
    #flart-docs-sidebar {
      position: sticky !important;
      top: 64px !important;
      height: calc(100vh - 64px) !important;
      max-height: calc(100vh - 64px) !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      flex-shrink: 0 !important;
      background: rgba(15, 23, 42, 0.5) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.07) !important;
    }

    /* Mobile / Tablet Drawer content (Independent scroll) */
    #flart-docs-drawer-content {
      height: calc(100vh - 64px) !important;
      max-height: calc(100vh - 64px) !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      background: #111827 !important;
      border-right: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5) !important;
    }

    #flart-docs-sidebar::-webkit-scrollbar,
    #flart-docs-drawer-content::-webkit-scrollbar {
      width: 5px;
    }
    #flart-docs-sidebar::-webkit-scrollbar-track,
    #flart-docs-drawer-content::-webkit-scrollbar-track {
      background: transparent;
    }
    #flart-docs-sidebar::-webkit-scrollbar-thumb,
    #flart-docs-drawer-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }
    #flart-docs-sidebar::-webkit-scrollbar-thumb:hover,
    #flart-docs-drawer-content::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0F19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>

  <script defer src="main.dart.js?v=2.2.0_1"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
